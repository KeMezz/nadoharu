# -- LOGIN_MUTATION --
mutation Login($input: LoginInput!) {
  login(input: $input) {
    user {
      id
      accountId
      email
      name
    }
  }
}

# -- CREATE_USER_MUTATION --
mutation CreateUser($input: CreateUserInput!) {
  createUser(input: $input) {
    id
    accountId
    email
    name
    createdAt
  }
}

# -- ME_QUERY --
query Me {
  me {
    id
    accountId
    email
    name
  }
}
